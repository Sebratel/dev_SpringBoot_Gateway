name: Imagem de staging

# Constroi a imagem e publica no GHCR a cada push na branch staging. O Portainer so baixa a imagem: o build
# dentro do host passa de 90 s e o proxy do stage derruba a requisicao de deploy.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write   # cria a tag vX.Y.Z da versao publicada
  packages: write

concurrency:
  group: imagem-staging
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sebratel/api-gateway

jobs:
  publicar:
    name: Construir e publicar a imagem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validar a versao do pom (obrigatoria, sem SNAPSHOT, ainda nao usada)
        id: versao
        run: python3 .github/scripts/validate-version.py
      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.versao.outputs.version }}
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.versao.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Marcar a versao no Git (tag vX.Y.Z)
        # A tag registra qual commit gerou a versao e impede reutiliza-la, mesmo que a imagem seja apagada do registry.
        run: |
          TAG="v${{ steps.versao.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG ja existe (re-run do mesmo commit)."
          else
            git tag "$TAG" "$GITHUB_SHA" && git push origin "$TAG"
          fi

      - name: Acionar deploy no Portainer (pull + redeploy)
        # So dispara o pull da imagem ja publicada acima; o host nao faz build, por isso nao
        # esbarra no timeout de 90s do proxy do stage (ver comentario no topo do arquivo).
        run: |
          curl --fail --silent --show-error -X POST "${{ secrets.PORTAINER_GATEWAY_WEBHOOK_URL }}"
