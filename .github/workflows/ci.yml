name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Menor privilegio: o CI so le o repositorio.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - testes, Checkstyle e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # o mesmo da imagem eclipse-temurin:21
          cache: maven
          # O parent vem do GitHub Packages: o servidor "github" usa o GITHUB_TOKEN.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify (testes + Checkstyle + JaCoCo)
        run: ./mvnw -B verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validacoes:
    name: Validacoes - versao do pom, nomes e ambiente
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Login so para consultar se a versao ja foi publicada no GHCR (docker manifest inspect).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Versao do pom (obrigatoria, sem SNAPSHOT, ainda nao usada)
        env:
          IMAGE: ghcr.io/sebratel/api-gateway
        run: python3 .github/scripts/validate-version.py
      - name: Dependencia do validador de compose
        run: pip install --quiet pyyaml
      - name: Compose (nome da stack, container, gateway do ambiente)
        run: >
          python3 .github/scripts/validate-compose.py --repo "${GITHUB_REPOSITORY#*/}" --env staging
          --exceptions .github/compose-exceptions.txt docker-compose-stage.yml

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem
        run: docker build -t app:ci .

  # Check unico para a protecao de branch. "if: always()" evita que ele seja pulado quando um needs falha.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [backend, imagem, validacoes]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Resultado agregado
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Pelo menos um job nao passou."; exit 1
          fi
