# Stack de STAGING (Portainer, a partir do Git: branch staging). A imagem e construida no GitHub Actions
# (workflow staging-image.yml) e publicada no GHCR; o Portainer so a baixa.
# Rede externa "proxy": a mesma do BFF atual; os serviços se enxergam pelo nome do container.
services:
  api-gateway:
    image: ghcr.io/sebratel/api-gateway:staging
    pull_policy: always
    container_name: api-gateway-stage
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - proxy
    ports:
      - "8082:8085"
      - "8094:8085"
    environment:
      - SERVER_PORT=8085
      - APP_ENV=staging
      - TZ=America/Sao_Paulo
      - MASSIVAS_URL=http://massivas-service-stage:8101
      - SPLITTERS_URL=http://splitters-service-stage:8102
      - COMERCIAL_URL=http://comercial-service-stage:8103
      - RADIUS_URL=http://radius-service-stage:8104
      - ESTOQUE_URL=http://estoque-service-stage:8105
      - PESSOAS_URL=http://pessoas-service-stage:8106
      # Monolito atual do stage (container do BFF). Ajustar se o nome mudar.
      - LEGACY_BFF_URL=http://bff-java-service-stage:8085
      - GATEWAY_DEFAULT_RESPONSE_TIMEOUT=600s
      # Autenticacao (so o gateway autentica). Basic legado: as mesmas SECURITY_USER/SECURITY_PASS do BFF original.
      - SECURITY_USER=${SECURITY_USER:-}
      - SECURITY_PASS=${SECURITY_PASS:-}
      - ALLOWED_EMAIL_DOMAIN=${ALLOWED_EMAIL_DOMAIN:-@sebratel.com.br}
      - DEPRECATION_SINCE=${DEPRECATION_SINCE:-2026-10-17}
      - DEPRECATION_SUNSET=${DEPRECATION_SUNSET:-2027-01-17}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  proxy:
    external: true
