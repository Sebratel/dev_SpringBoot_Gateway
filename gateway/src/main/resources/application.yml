spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
          issuer-uri: https://accounts.google.com
  cloud:
    circuitbreaker:
      resilience4j:
        # O TimeLimiter do Resilience4j vem com 1 s por padrao e cortaria as rotas lentas. O limite de
        # tempo e do cliente HTTP do gateway (response-timeout), nao do circuit breaker.
        disable-time-limiter: true
    gateway:
      server:
        webflux:
          httpclient:
            # Limite padrao de resposta: estourou, o gateway responde 504. Em stage fica folgado (rotas de relatorio levam minutos); o proxy do
            # stage corta em 90 s, entao use a porta direta para essas. As rotas lentas (no routes/routes.yml, metadata response-timeout: -1) ignoram este limite.
            response-timeout: ${GATEWAY_DEFAULT_RESPONSE_TIMEOUT:600s}
            connect-timeout: 10000
          # Limite do corpo da requisicao (Content-Length): acima disso o gateway responde 413 sem chegar ao servico.
          default-filters:
            - name: RequestSize
              args:
                maxSize: ${GATEWAY_MAX_BODY_SIZE:2MB}
  config:
    import:
      - optional:classpath:routes/routes.yml

gateway:
  security:
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:@sebratel.com.br}
    # HTTP Basic legado (paridade com o BFF original: scripts e n8n). Sem as duas variaveis, nao ha usuario Basic.
    basic:
      user: ${SECURITY_USER:}
      password: ${SECURITY_PASS:}
  # Cadastro de consumidores (um usuario Basic por sistema): arquivo YAML FORA do Git, so com hashes bcrypt, relido
  # sozinho. Ver docs/CONSUMIDORES.md e consumers.example.yml. Sem o arquivo, vale so o usuario legado acima.
  consumers:
    file: ${GATEWAY_CONSUMERS_FILE:}
    reload-seconds: 30
  # Limite de taxa por consumidor, em memoria, POR INSTANCIA: e a rede de seguranca. O limite principal fica no nginx
  # (compartilhado entre as instancias). Medicao em producao (20/08 a 18/10): pico de 46 req/s e 96 req/min no total;
  # com +30% e folga, o padrao e 50 req/s sustentado e rajada de 300. Cada consumidor pode ter o seu no cadastro.
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-second: ${GATEWAY_RATE_LIMIT_RPS:50}
    burst: ${GATEWAY_RATE_LIMIT_BURST:300}

# Deprecacao de rotas sem uso (deprecated-routes.txt): header Deprecation (RFC 9745) e Sunset (RFC 8594).
deprecation:
  since: ${DEPRECATION_SINCE:2026-10-17}
  sunset: ${DEPRECATION_SUNSET:2027-01-17}

server:
  port: ${SERVER_PORT:8085}
  # O proxy do stage manda X-Forwarded-Proto/For: com isso o gateway enxerga https (HSTS) e o IP real do cliente.
  forward-headers-strategy: framework

management:
  server:
    # Actuator em porta propria, NAO publicada: so a rede privada (Prometheus) enxerga metricas e saude agregada.
    # A porta publica responde so /actuator/health (HealthCompatController).
    port: ${MANAGEMENT_PORT:8086}
  endpoints:
    web:
      exposure:
        # services = saude agregada dos servicos; prometheus = metricas para coleta.
        include: health,info,metrics,prometheus,services
  metrics:
    tags:
      application: api-gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.cloud.gateway.requests: true

# Circuit breaker por servico (filtro CircuitBreaker nas rotas svc-*). Abre quando metade das ultimas 20 chamadas
# falhou (502/503/504 ou erro de conexao; 4xx e 500 de negocio NAO contam) e responde 503 em /fallback/{servico}.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
