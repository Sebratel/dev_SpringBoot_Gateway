spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
          issuer-uri: https://accounts.google.com
  cloud:
    circuitbreaker:
      resilience4j:
        # O TimeLimiter do Resilience4j vem com 1 s por padrao e cortaria as rotas lentas. O limite de
        # tempo e do cliente HTTP do gateway (response-timeout), nao do circuit breaker.
        disable-time-limiter: true
    gateway:
      server:
        webflux:
          httpclient:
            # Limite padrao de resposta: estourou, o gateway responde 504. Em stage fica folgado (rotas de relatorio levam minutos); o proxy do
            # stage corta em 90 s, entao use a porta direta para essas. As rotas lentas (no routes/routes.yml, metadata response-timeout: -1) ignoram este limite.
            response-timeout: ${GATEWAY_DEFAULT_RESPONSE_TIMEOUT:600s}
            connect-timeout: 10000
  config:
    import:
      - optional:classpath:routes/routes.yml

gateway:
  security:
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:@sebratel.com.br}
    # HTTP Basic legado (paridade com o BFF original: scripts e n8n). Sem as duas variaveis, nao ha usuario Basic.
    basic:
      user: ${SECURITY_USER:}
      password: ${SECURITY_PASS:}

# Deprecacao de rotas sem uso (deprecated-routes.txt): header Deprecation (RFC 9745) e Sunset (RFC 8594).
deprecation:
  since: ${DEPRECATION_SINCE:2026-10-17}
  sunset: ${DEPRECATION_SUNSET:2027-01-17}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
