# Rotas lentas conhecidas: SEM limite de tempo de resposta no gateway (metadata response-timeout: -1).
# Todas as demais rotas seguem o limite padrao (GATEWAY_DEFAULT_RESPONSE_TIMEOUT, padrao 60s), e estouram em 504.
#
# FONTE: platform/contract-tests/src/test/resources/known-slow-routes.txt (mesma lista de 18 rotas).
# Ao adicionar ou remover uma rota lenta, altere os DOIS arquivos; o TimeoutPolicyTest confere que sao iguais.
#
# Fase 2: estas rotas apontam ao monolito (LEGACY_BFF_URL). Na fase 3 cada uma passa a apontar ao seu servico.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: slow-api-v1-consumo
              uri: ${LEGACY_BFF_URL:http://bff-app:8085}
              predicates:
                - Method=GET
                - Path=/api/v1/consumo
              metadata:
                response-timeout: -1
            - id: slow-api-v1-consumo-alto
              uri: ${LEGACY_BFF_URL:http://bff-app:8085}
