              predicates:
                - Method=GET
                - Path=/api/v1/primeiro-pagante-mensal/first-monthly-payer
              metadata:
                response-timeout: -1
            - id: slow-api-v1-primeiro-pagante-mensal-primeiro-pagante-mensal
              uri: ${gateway.upstreams.comercial}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/primeiro-pagante-mensal/primeiro-pagante-mensal
              metadata:
