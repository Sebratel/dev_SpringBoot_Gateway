            # --- rotas por servico ---
            - id: svc-massivas
              uri: ${gateway.upstreams.massivas}
              order: 10
              filters:
                - name: CircuitBreaker
                  args:
                    name: massivas
                    fallbackUri: forward:/fallback/massivas
                    statusCodes: 502,503,504
                - name: Retry
                  args:
                    retries: ${GATEWAY_RETRIES:2}
                    methods: GET
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    exceptions: java.io.IOException
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 1000ms
                      factor: 2
              predicates:
                - Path=/api/v1/afetados,/api/v1/afetados/contract/{contractId},/api/v1/afetados/pppoe/{pppoe},/api/v1/afetados/protocol/{protocol},/api/v1/gmud/abrir-via-api,/api/v1/gmud/encerrar-via-api,/api/v1/gmud/finalizar-via-api,/api/v1/gmud/open-via-api,/api/v1/gmud/relato-via-api,/api/v1/gmud/report-via-api,/api/v1/impacted-users,/api/v1/impacted-users/contract/{contractId},/api/v1/impacted-users/pppoe/{pppoe},/api/v1/impacted-users/protocol/{protocol},/api/v1/massivas,/api/v1/massivas-eleven,/api/v1/massivas-eleven/abrir-protocolo-infra-via-api,/api/v1/massivas-eleven/estimated-end/contract/{contractNumber},/api/v1/massivas-eleven/finalizar-chamado-via-api,/api/v1/massivas-eleven/finalize-ticket-via-api,/api/v1/massivas-eleven/getAllMassives,/api/v1/massivas-eleven/open-infra-solicitation-via-api,/api/v1/massivas-eleven/previsao-finalizacao/contrato/{contractNumber},/api/v1/massivas-eleven/recover-via-database,/api/v1/massivas-eleven/recuperar-pelo-banco,/api/v1/massivas-eleven/salvar-massiva-via-api,/api/v1/massivas-eleven/save-massive-via-api,/api/v1/massivas-eleven/status-por-protocolos,/api/v1/massivas-eleven/status-by-protocols,/api/v1/massivas-history/recover-via-database,/api/v1/massivas-history/recuperar-pelo-banco,/api/v1/massivas-history/{protocol}/cancel,/api/v1/massivas-history/{protocol}/cancelar,/api/v1/massivas-history/{protocol}/encerrar,/api/v1/massivas-history/{protocol}/finalize,/api/v1/massivas-splitters/recover-via-database,/api/v1/massivas-splitters/recuperar-pelo-banco,/api/v1/massivas-splitters/{protocol}/cancel,/api/v1/massivas-splitters/{protocol}/cancelar,/api/v1/massivas-splitters/{protocol}/encerrar,/api/v1/massivas-splitters/{protocol}/finalize,/api/v1/massivas/abrir-protocolo-infra-via-api,/api/v1/massivas/estimated-end/contract/{contractNumber},/api/v1/massivas/finalizar-chamado-via-api,/api/v1/massivas/finalize-ticket-via-api,/api/v1/massivas/getAllMassives,/api/v1/massivas/open-infra-solicitation-via-api,/api/v1/massivas/pr