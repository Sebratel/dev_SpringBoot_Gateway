# Destinos (rede interna). Rollback de um dominio = apontar a variavel para o legacy-bff.
# As rotas por dominio sao geradas a partir de contract-tests/src/test/resources/manifest.json (um destino por servico).
# Uma unica lista de rotas (o Spring substitui, nao junta, listas de arquivos diferentes):
# 1) rotas lentas conhecidas: SEM limite de resposta (metadata response-timeout: -1), order -1, ganham das do servico.
#    A lista e a mesma de contract-tests/src/test/resources/known-slow-routes.txt (o TimeoutPolicyTest confere).
# 2) uma rota por servico, com circuit breaker (503 em /fallback/{servico}) e retry so de GET em 502/503/erro de conexao; com todos os caminhos dele (order 10). As demais seguem o limite padrao (60 s) e estouram em 504.
gateway:
  upstreams:
    massivas: ${MASSIVAS_URL:http://massivas-service:8101}
    splitters: ${SPLITTERS_URL:http://splitters-service:8102}
    comercial: ${COMERCIAL_URL:http://comercial-service:8103}
    radius: ${RADIUS_URL:http://radius-service:8104}
    estoque: ${ESTOQUE_URL:http://estoque-service:8105}
    pessoas: ${PESSOAS_URL:http://pessoas-service:8106}
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # --- rotas lentas: sem limite de resposta ---
            - id: slow-api-v1-consumo
              uri: ${gateway.upstreams.radius}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/consumo
              metadata:
                response-timeout: -1
            - id: slow-api-v1-consumo-alto
              uri: ${gateway.upstreams.radius}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/consumo-alto
              metadata:
                response-timeout: -1
            - id: slow-api-v1-consumo-alto-paginado
              uri: ${gateway.upstreams.radius}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/consumo-alto-paginado
              metadata:
                response-timeout: -1
            - id: slow-api-v1-contracts-last-connections
              uri: ${gateway.upstreams.radius}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/contracts/last-connections
              metadata:
                response-timeout: -1
            - id: slow-api-v1-contracts-ultimas-conexoes
              uri: ${gateway.upstreams.radius}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/contracts/ultimas-conexoes
              metadata:
                response-timeout: -1
            - id: slow-api-v1-contratos-last-connections
              uri: ${gateway.upstreams.radius}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/contratos/last-connections
              metadata:
                response-timeout: -1
            - id: slow-api-v1-contratos-ultimas-conexoes
              uri: ${gateway.upstreams.radius}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/contratos/ultimas-conexoes
              metadata:
                response-timeout: -1
            - id: slow-api-v1-high-consumption
              uri: ${gateway.upstreams.radius}
              order: -1
              predicates:
                - Method=GET
                - Path=/api/v1/high-consumption
              metadata:
                response-timeout: -1
            - id: slow-api-v1-high-consumption-paged
